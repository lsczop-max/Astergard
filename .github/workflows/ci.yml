name: CI

on:
  push:
  pull_request:

jobs:
  web-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff mypy
      - name: Validate world export
        run: python -m tools.export_mudlet_map
      - name: Build Mudlet release
        run: python -m tools.build_mudlet_package
      - name: WebSocket gateway tests
        run: pytest -q tests/test_d59_websocket_gateway.py
      - name: Run tests
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
