name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff mypy
      - name: Validate world export
        run: python -m tools.export_mudlet_map
      - name: Build Mudlet release
        run: python -m tools.build_mudlet_package
      - name: Run tests
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
